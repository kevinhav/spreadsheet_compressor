[project]
name = "spreadsheet-compressor"
version = "0.1.0"
description = "Compress Excel files for LLM consumption"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.2",
    "numpy",
    "xlrd==2.0.1",
    "openpyxl>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spreadsheet_compressor"]
